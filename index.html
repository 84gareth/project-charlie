<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- Charlie's home page: pick one of his two games. Pictures, no words to
       read (he's 5). Each game is in its own folder with its own tests. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Charlie's Games">
  <!-- The Home Screen icon: Charlie's blue helper, his choice. -->
  <link rel="apple-touch-icon" href="street/assets/icons/apple-touch-icon.png">
  <link rel="icon" href="street/assets/icons/apple-touch-icon.png">
  <title>Charlie's Games</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffd84d;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: ui-rounded, system-ui, sans-serif;
    }
    /* Two big picture buttons, side by side on a landscape iPad and one
       above the other held upright, clear of the rounded corners. */
    #games {
      position: fixed;
      inset: 0;
      display: flex;
      gap: 4vmin;
      align-items: center;
      justify-content: center;
      padding: max(5vmin, env(safe-area-inset-top)) max(5vmin, env(safe-area-inset-right))
               max(5vmin, env(safe-area-inset-bottom)) max(5vmin, env(safe-area-inset-left));
      box-sizing: border-box;
    }
    @media (orientation: portrait) { #games { flex-direction: column; } }
    .game {
      position: relative;
      flex: 1 1 0;
      width: 100%;
      height: 100%;
      max-height: 80vmin;
      border-radius: 6vmin;
      border: 1.4vmin solid #261a40;
      overflow: hidden;
      box-shadow: 0 2vmin 0 #261a40;
      display: block;
    }
    .game:active { transform: translateY(1vmin); box-shadow: 0 1vmin 0 #261a40; }
    /* The street game: a bit of the street with Charlie's bugs on it. */
    #street {
      background: linear-gradient(#8cccfa 0 62%, #b8b8bd 62% 78%, #4d4f57 78%);
    }
    /* The bugs stand in a row on the pavement, never on top of each other. */
    #street .bugs {
      position: absolute; left: 4%; right: 4%; bottom: 14%; height: 58%;
      display: flex; justify-content: space-around; align-items: flex-end;
    }
    #street img { max-width: 31%; max-height: 100%; object-fit: contain; }
    #street .bug1, #street .bug3 { margin-bottom: 14%; max-height: 78%; }
    /* Charlie's Traitors: his castle, all of it. */
    #traitors { background: #eeeae6 url("traitors/assets/castle.jpg") center / contain no-repeat; }
  </style>
</head>
<body>
  <div id="games">
    <a class="game" id="street" href="street/" aria-label="The street game with Charlie's bugs">
      <div class="bugs">
        <img class="bug1" src="street/assets/baddies/house_bug.png" alt="">
        <img class="bug2" src="street/assets/baddies/teleport_bug.png" alt="">
        <img class="bug3" src="street/assets/baddies/acorn.png" alt="">
      </div>
    </a>
    <a class="game" id="traitors" href="traitors/" aria-label="Charlie's Traitors"></a>
  </div>
</body>
</html>
